apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: plateforme-crypto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: plateforme-crypto-frontend
          ports:
            - containerPort: 5173
          envFrom:
            - configMapRef:
                name: app-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: plateforme-crypto
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 5173
      targetPort: 5173
      nodePort: 30080

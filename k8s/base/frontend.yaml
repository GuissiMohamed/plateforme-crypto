apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: plateforme-crypto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: plateforme-crypto-frontend
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: app-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: plateforme-crypto
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: plateforme-crypto
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager:9093
    rule_files:
      - /etc/prometheus/rules.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["prometheus:9090"]
      - job_name: backend
        metrics_path: /metrics
        static_configs:
          - targets: ["backend:8000"]
      - job_name: postgres
        static_configs:
          - targets: ["postgres-exporter:9187"]
  rules.yml: |
    groups:
      - name: plateforme-crypto
        rules:
          - alert: ServiceDown
            expr: up == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Service indisponible"
              description: "Le service {{ $labels.job }} est indisponible depuis plus de 2 minutes."

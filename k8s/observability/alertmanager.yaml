apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: plateforme-crypto
data:
  alertmanager.yml: |
    route:
      receiver: default
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
    receivers:
      - name: default
        webhook_configs:
          - url: http://localhost:9099
            send_resolved: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: plateforme-crypto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
          ports:
            - containerPort: 9093
          volumeMounts:
            - name: alertmanager-config
              mountPath: /etc/alertmanager
      volumes:
        - name: alertmanager-config
          configMap:
            name: alertmanager-config
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: plateforme-crypto
spec:
  selector:
    app: alertmanager
  ports:
    - port: 9093
      targetPort: 9093

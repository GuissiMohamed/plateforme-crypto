name: Quality Analysis & Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pylint flake8 bandit black isort mypy -q

      - name: Run Tests with Coverage
        run: |
          cd backend
          pytest test_main.py \
            --cov=main \
            --cov=auth \
            --cov=db \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term \
            -v

      - name: Check Code Style (Black)
        run: |
          cd backend
          black --check main.py auth.py db.py || true

      - name: Import Sorting (isort)
        run: |
          cd backend
          isort --check-only main.py auth.py db.py || true

      - name: Lint with Pylint
        run: |
          cd backend
          pylint main.py auth.py db.py --exit-zero --output-format=parseable | tee pylint-report.txt

      - name: Lint with Flake8
        run: |
          cd backend
          flake8 main.py auth.py db.py \
            --max-line-length=120 \
            --extend-ignore=E203,W503 \
            --format=json > flake8-report.json || true

      - name: Security Check (Bandit)
        run: |
          cd backend
          bandit -r main.py auth.py db.py \
            -f json -o bandit-report.json \
            --skip B101,B601 || true

      - name: Type Checking (mypy)
        run: |
          cd backend
          mypy main.py auth.py db.py --ignore-missing-imports || true

      - name: Generate Quality Report
        run: |
          cd backend
          echo "# Quality Analysis Report" > QUALITY_REPORT.md
          echo "" >> QUALITY_REPORT.md
          echo "## Test Results" >> QUALITY_REPORT.md
          echo "\`\`\`" >> QUALITY_REPORT.md
          pytest test_main.py --cov=main --cov=auth --cov=db --cov-report=term-missing | tail -20 >> QUALITY_REPORT.md
          echo "\`\`\`" >> QUALITY_REPORT.md

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload HTML Coverage Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: backend/htmlcov/

      - name: Comment PR with Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('./backend/QUALITY_REPORT.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

      - name: SonarQube Analysis
        if: always()
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_LOGIN: ${{ secrets.SONAR_LOGIN }}
        run: |
          if [ -n "$SONAR_LOGIN" ]; then
            cd backend
            sonar-scanner \
              -Dsonar.projectKey=plateforme-crypto \
              -Dsonar.sources=. \
              -Dsonar.host.url=$SONAR_HOST_URL \
              -Dsonar.login=$SONAR_LOGIN \
              -Dsonar.python.coverage.reportPaths=coverage.xml
          else
            echo "SonarQube secrets not configured, skipping..."
          fi

      - name: Quality Gate Check
        run: |
          cd backend
          COVERAGE=$(cat .coverage.* 2>/dev/null | grep -oP 'percent_covered["\']?\s*:\s*\K[\d.]+' || echo "0")

          echo "Coverage: $COVERAGE%"

          if (( $(echo "$COVERAGE < 15" | bc -l) )); then
            echo "⚠️  Coverage < 15%, please add more tests"
            exit 1
          fi

          echo "✅ Quality gate passed!"

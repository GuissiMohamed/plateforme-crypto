name: CI/CD Pipeline

on:
  push:
    branches: ["main", "develop"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/plateforme-crypto

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r collector/requirements.txt
          pip install pytest black isort flake8
      - name: Run backend tests
        run: |
          cd backend
          pytest -q
      - name: Lint backend
        run: |
          cd backend
          black --check .
          isort --check-only .
          flake8 .

  build:
    runs-on: ubuntu-latest
    needs: lint-test
    strategy:
      matrix:
        service: [backend, frontend, collector]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha
            type=ref,event=tag
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  trivy-scan:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        service: [backend, frontend, collector]
    steps:
      - uses: actions/checkout@v4
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true

  deploy:
    runs-on: ubuntu-latest
    needs: trivy-scan
    if: github.event_name != 'pull_request'
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.29.0
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "${{ secrets.KUBECONFIG_PROD }}" > ~/.kube/config
          else
            echo "${{ secrets.KUBECONFIG_STAGING }}" > ~/.kube/config
          fi
      - name: Update image tags
        run: |
          sed -i "s#ghcr.io/placeholder/plateforme-crypto-backend#${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend#g" k8s/kustomization.yaml
          sed -i "s#ghcr.io/placeholder/plateforme-crypto-frontend#${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend#g" k8s/kustomization.yaml
          sed -i "s#ghcr.io/placeholder/plateforme-crypto-collector#${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-collector#g" k8s/kustomization.yaml
          sed -i "s/newTag: latest/newTag: ${{ github.sha }}/g" k8s/kustomization.yaml
      - name: Deploy
        run: kubectl apply -k k8s

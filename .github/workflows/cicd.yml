name: CI/CD - Build, Push & Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend, collector]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/plateforme-crypto-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/plateforme-crypto-${{ matrix.service }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.29.0

      - name: Create Kind cluster
        uses: kindest/setup-kind@v1
        with:
          version: v0.22.0

      - name: Pull images
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/plateforme-crypto-backend:${{ github.sha }}
          docker pull ghcr.io/${{ github.repository_owner }}/plateforme-crypto-frontend:${{ github.sha }}
          docker pull ghcr.io/${{ github.repository_owner }}/plateforme-crypto-collector:${{ github.sha }}

      - name: Load images into Kind
        run: |
          kind load docker-image ghcr.io/${{ github.repository_owner }}/plateforme-crypto-backend:${{ github.sha }}
          kind load docker-image ghcr.io/${{ github.repository_owner }}/plateforme-crypto-frontend:${{ github.sha }}
          kind load docker-image ghcr.io/${{ github.repository_owner }}/plateforme-crypto-collector:${{ github.sha }}

      - name: Configure manifests
        run: |
          sed -i "s#ghcr.io/placeholder/plateforme-crypto-backend#ghcr.io/${{ github.repository_owner }}/plateforme-crypto-backend#g" k8s/kustomization.yaml
          sed -i "s#ghcr.io/placeholder/plateforme-crypto-frontend#ghcr.io/${{ github.repository_owner }}/plateforme-crypto-frontend#g" k8s/kustomization.yaml
          sed -i "s#ghcr.io/placeholder/plateforme-crypto-collector#ghcr.io/${{ github.repository_owner }}/plateforme-crypto-collector#g" k8s/kustomization.yaml
          sed -i "s/newTag: latest/newTag: ${{ github.sha }}/g" k8s/kustomization.yaml

      - name: Deploy to Kubernetes
        run: kubectl apply -k k8s

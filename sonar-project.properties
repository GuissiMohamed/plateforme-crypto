# Configuration SonarQube pour Plateforme Crypto

# Identifiant du projet
sonar.projectKey=plateforme-crypto
sonar.projectName=Plateforme Crypto Market Analytics
sonar.projectVersion=1.0.0

# Répertoires source
sonar.sources=backend
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/env/**,**/__pycache__/**,**/site-packages/**

# Tests et couverture
sonar.tests=backend
sonar.test.inclusions=**/test_*.py
sonar.python.coverage.reportPaths=backend/htmlcov/coverage.xml

# Chemin vers rapport de couverture
sonar.coverage.exclusions=**/test_*.py,**/env/**

# Analyse Python
sonar.python.pylint.reportPath=backend/.pylint-report.txt
sonar.python.flake8.reportPath=backend/.flake8-report.txt

# Règles qualité
sonar.qualitygate.wait=true

# Host et Token (optionnel pour exécution locale)
# sonar.host.url=http://localhost:9000
# sonar.login=your_token_here
